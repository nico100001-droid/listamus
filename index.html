<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winamp Web Player</title>
    <style>
        body { 
            font-family: 'Consolas', 'Courier New', monospace; 
            max-width: 900px; /* Ampliado para acomodar las dos columnas */
            margin: auto; 
            padding: 15px; 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        h2, h3 { margin-top: 0; color: #00ff66; text-transform: uppercase; }
        
        .seccion { 
            background: #1e1e1e; 
            border: 1px solid #333; 
            border-radius: 4px; 
            padding: 15px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        /* Estructura en columnas para Catálogo y Pistas */
        .grid-columnas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .grid-columnas .seccion {
            margin-bottom: 0; /* Anula el margen inferior dentro del grid */
        }

        @media (max-width: 768px) {
            .grid-columnas {
                grid-template-columns: 1fr;
            }
        }

        /* Pantalla visual estilo Winamp */
        .pantalla-winamp {
            background-color: #000;
            border: 1px solid #00ff66;
            padding: 10px;
            border-radius: 3px;
            margin-bottom: 10px;
            text-align: center;
        }

        #info-pista {
            color: #00ff66;
            font-size: 14px;
            margin: 0 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Canvas del Osciloscopio */
        #visualizador {
            width: 100%;
            height: 80px;
            background-color: #050505;
            border: 1px solid #222;
            display: block;
        }

        /* Controles estilo ciberpunk/retro */
        .controles {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 10px;
        }

        .controles button, .btn-accion { 
            padding: 8px 12px; 
            cursor: pointer; 
            border: 1px solid #00ff66; 
            background-color: #111; 
            color: #00ff66; 
            font-weight: bold;
            font-family: inherit;
            border-radius: 8px; /* Puntas más redondeadas */
            transition: all 0.2s ease;
        }

        .controles button:hover, .btn-accion:hover { 
            background-color: #00ff66; 
            color: #000;
        }

        input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 10px; 
            box-sizing: border-box; 
            border: 1px solid #444; 
            background-color: #2a2a2a;
            color: #fff;
            font-family: inherit;
            border-radius: 3px; 
        }

        /* Listas de reproducción */
        .lista { list-style: none; padding: 0; margin: 0; }
        .lista li { 
            padding: 8px; 
            border-bottom: 1px solid #2a2a2a; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 13px;
        }

        .activo { 
            background-color: #1b3a20; 
            border-left: 4px solid #00ff66; 
            color: #00ff66;
            font-weight: bold;
        }

        .btn-activo {
            background-color: #00ff66 !important;
            color: #000 !important;
        }
    </style>
</head>
<body>

    <!-- Módulo Reproductor Principal -->
    <div class="seccion">
        <div class="pantalla-winamp">
            <h2 id="info-pista">WINAMP // SELECCIONAR PISTA</h2>
            <canvas id="visualizador" width="600" height="80"></canvas>
        </div>
        
        <audio id="reproductor" crossorigin="anonymous" style="width: 100%; margin-bottom: 10px;" controls></audio>
        
        <div class="controles">
            <button onclick="cambiarTema(-1)">&lt;&lt; ANT</button>
            <button onclick="saltarTiempo(-10)">-10S</button>
            <button onclick="togglePlayPausa()">PLAY / PAUSE</button>
            <button onclick="saltarTiempo(10)">+10S</button>
            <button onclick="cambiarTema(1)">SIG &gt;&gt;</button>
            <button id="btn-aleatorio" onclick="toggleAleatorio()">ALEATORIO</button>
        </div>
    </div>

    <!-- Contenedor de dos columnas para Catálogo y Pistas -->
    <div class="grid-columnas">
        <!-- Módulo Catálogo de Álbumes -->
        <div class="seccion">
            <h3>Catálogo de Álbumes</h3>
            <input type="text" id="buscador-album" placeholder="Buscar artista o álbum..." onkeyup="filtrarAlbumes()">
            <ul id="lista-albumes" class="lista"></ul>
        </div>

        <!-- Módulo Pistas del Álbum Actual -->
        <div class="seccion">
            <h3>Pistas de la Lista Actual</h3>
            <ul id="lista-pistas" class="lista"></ul>
        </div>
    </div>

    <!-- Módulo Listas Personalizadas (Memoria Local) -->
    <div class="seccion">
        <h3>Listas Guardadas (Memoria Local)</h3>
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <input type="text" id="nombre-nueva-lista" placeholder="Nombre de lista nueva..." style="margin-bottom: 0;">
            <button class="btn-accion" onclick="crearListaPropia()">Crear</button>
        </div>
        <div id="contenedor-listas-propias"></div>
    </div>

    <script>
        let baseAlbumes = [];
        let pistasCargadas = [];
        let indiceActual = -1;
        let listasPersonalizadas = JSON.parse(localStorage.getItem('mis_listas')) || {};
        let aleatorioActivo = false;

        const reproductor = document.getElementById('reproductor');
        const infoPista = document.getElementById('info-pista');
        const listaAlbumesUI = document.getElementById('lista-albumes');
        const listaPistasUI = document.getElementById('lista-pistas');

        // --- MOTOR DEL VISUALIZADOR DE ONDA (WEB AUDIO API) ---
        let audioCtx;
        let analizador;
        let fuenteNodo;
        let visualizadorInicializado = false;

        const canvas = document.getElementById('visualizador');
        const canvasCtx = canvas.getContext('2d');

        function inicializarVisualizador() {
            if (visualizadorInicializado) return;
            
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analizador = audioCtx.createAnalyser();
                analizador.fftSize = 2048;
                
                fuenteNodo = audioCtx.createMediaElementSource(reproductor);
                fuenteNodo.connect(analizador);
                analizador.connect(audioCtx.destination);
                
                visualizadorInicializado = true;
                dibujarOsciloscopio();
            } catch (e) {
                console.error("Error al inicializar AudioContext:", e);
            }
        }

        function dibujarOsciloscopio() {
            requestAnimationFrame(dibujarOsciloscopio);

            const bufferLongitud = analizador.frequencyBinCount;
            const datosTiempo = new Uint8Array(bufferLongitud);
            analizador.getByteTimeDomainData(datosTiempo);

            canvasCtx.fillStyle = '#050505';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#00ff66';
            canvasCtx.beginPath();

            const anchoAncho = (canvas.width * 1.0) / bufferLongitud;
            let x = 0;

            for (let i = 0; i < bufferLongitud; i++) {
                const v = datosTiempo[i] / 128.0;
                const y = (v * canvas.height) / 2;

                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }
                x += anchoAncho;
            }

            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }

        // --- CARGA DE DATOS Y CATALOGO ---
        fetch('lista.json')
            .then(res => res.json())
            .then(datos => {
                baseAlbumes = datos;
                renderizarAlbumes(baseAlbumes);
            })
            .catch(err => console.error("Error al cargar lista.json:", err));

        function renderizarAlbumes(lista) {
            listaAlbumesUI.innerHTML = '';
            lista.forEach((item) => {
                let li = document.createElement('li');
                
                if (item.item_id) {
                    li.innerHTML = `<span><strong>${item.artista}</strong> - ${item.album} (Álbum)</span>
                                    <button class="btn-accion" onclick="cargarAlbum('${item.item_id}', '${escapeQuotes(item.artista)}', '${escapeQuotes(item.album)}')">Cargar Álbum</button>`;
                } else if (item.url_mp3) {
                    li.innerHTML = `<span><strong>${item.artista}</strong> - ${item.album} (Pista)</span>
                                    <button class="btn-accion" onclick="cargarTemaIndividual('${escapeQuotes(item.artista)}', '${escapeQuotes(item.album)}', '${escapeQuotes(item.url_mp3)}')">Cargar Tema</button>`;
                }
                listaAlbumesUI.appendChild(li);
            });
        }

        function filtrarAlbumes() {
            const texto = document.getElementById('buscador-album').value.toLowerCase();
            const filtrados = baseAlbumes.filter(item => 
                item.artista.toLowerCase().includes(texto) ||
                item.album.toLowerCase().includes(texto)
            );
            renderizarAlbumes(filtrados);
        }

        async function cargarAlbum(itemId, artista, album) {
            pistasCargadas = [];
            infoPista.textContent = "CARGANDO DESDE ARCHIVE.ORG...";
            const urlApi = `https://archive.org/metadata/${itemId}`;

            try {
                const respuesta = await fetch(urlApi);
                if (!respuesta.ok) throw new Error('Error al conectar con la API');
                
                const datos = await respuesta.json();

                const archivosAudio = datos.files.filter(f => 
                    f.format === 'VBR MP3' || 
                    f.format === 'MP3' || 
                    (f.name && f.name.toLowerCase().endsWith('.mp3'))
                );

                if (archivosAudio.length === 0) {
                    alert('No se encontraron archivos MP3 en este recurso.');
                    infoPista.textContent = "SELECCIONAR PISTA";
                    return;
                }

                pistasCargadas = archivosAudio.map(f => ({
                    titulo: `${artista} - ${f.title || f.name}`,
                    url: `https://archive.org/download/${itemId}/${encodeURIComponent(f.name)}`
                }));

                renderizarPistas();
                cargarPista(0);

            } catch (e) {
                console.error('Error al procesar metadatos:', e);
                alert('No se pudieron obtener las pistas del álbum.');
                infoPista.textContent = "ERROR AL CARGAR";
            }
        }

        function cargarTemaIndividual(artista, album, url) {
            pistasCargadas = [{
                titulo: `${artista} - ${album}`,
                url: url
            }];
            renderizarPistas();
            cargarPista(0);
        }

        function renderizarPistas() {
            listaPistasUI.innerHTML = '';
            pistasCargadas.forEach((pista, idx) => {
                let li = document.createElement('li');
                if (idx === indiceActual) li.classList.add('activo');
                
                li.innerHTML = `<span onclick="cargarPista(${idx})" style="cursor:pointer; flex-grow: 1;">${pista.titulo}</span>
                                <button class="btn-accion" onclick="agregarAPistaGuardada('${escapeQuotes(pista.titulo)}', '${escapeQuotes(pista.url)}')">+ GUARDAR</button>`;
                listaPistasUI.appendChild(li);
            });
        }

        function escapeQuotes(cadena) {
            return cadena ? cadena.replace(/'/g, "\\'") : '';
        }

        function cargarPista(indice) {
            if (indice >= 0 && indice < pistasCargadas.length) {
                indiceActual = indice;
                reproductor.src = pistasCargadas[indiceActual].url;
                infoPista.textContent = pistasCargadas[indiceActual].titulo;
                
                // Activar audio context para el osciloscopio
                inicializarVisualizador();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                reproductor.play();
                renderizarPistas();
            }
        }

        // --- CONTROLES DE REPRODUCCIÓN ---
        function togglePlayPausa() {
            inicializarVisualizador();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (reproductor.paused) {
                reproductor.play();
            } else {
                reproductor.pause();
            }
        }

        function saltarTiempo(segundos) {
            reproductor.currentTime += segundos;
        }

        function toggleAleatorio() {
            aleatorioActivo = !aleatorioActivo;
            const btn = document.getElementById('btn-aleatorio');
            if (aleatorioActivo) {
                btn.classList.add('btn-activo');
            } else {
                btn.classList.remove('btn-activo');
            }
        }

        function cambiarTema(direccion) {
            if (pistasCargadas.length === 0) return;
            
            let nuevoIndice;
            
            // Si el modo aleatorio está activo y se avanza de tema
            if (aleatorioActivo && direccion > 0) {
                nuevoIndice = Math.floor(Math.random() * pistasCargadas.length);
            } else {
                nuevoIndice = indiceActual + direccion;
            }

            // Validar límites
            if (nuevoIndice >= 0 && nuevoIndice < pistasCargadas.length) {
                cargarPista(nuevoIndice);
            }
        }

        reproductor.onended = () => cambiarTema(1);

        // --- MEMORIA LOCAL (LOCALSTORAGE) ---
        function crearListaPropia() {
            const input = document.getElementById('nombre-nueva-lista');
            const nombre = input.value.trim();
            if (nombre && !listasPersonalizadas[nombre]) {
                listasPersonalizadas[nombre] = [];
                guardarListasEnStorage();
                input.value = '';
                renderizarListasPropia();
            }
        }

        function agregarAPistaGuardada(titulo, url) {
            const nombresListas = Object.keys(listasPersonalizadas);
            if (nombresListas.length === 0) {
                alert('Cree una lista personalizada en el módulo inferior primero.');
                return;
            }
            const destino = prompt(`Escriba el nombre de la lista de destino:\n${nombresListas.join('\n')}`);
            if (destino && listasPersonalizadas[destino]) {
                listasPersonalizadas[destino].push({ titulo, url });
                guardarListasEnStorage();
                renderizarListasPropia();
            } else if (destino) {
                alert('La lista especificada no existe.');
            }
        }

        function cargarListaPersonalizada(nombreLista) {
            pistasCargadas = listasPersonalizadas[nombreLista];
            renderizarPistas();
            if (pistasCargadas.length > 0) cargarPista(0);
        }

        function guardarListasEnStorage() {
            localStorage.setItem('mis_listas', JSON.stringify(listasPersonalizadas));
        }

        function renderizarListasPropia() {
            const contenedor = document.getElementById('contenedor-listas-propias');
            contenedor.innerHTML = '';
            for (let nombre in listasPersonalizadas) {
                let div = document.createElement('div');
                div.style.margin = "8px 0";
                div.style.display = "flex";
                div.style.justifyContent = "space-between";
                div.style.alignItems = "center";
                div.innerHTML = `<span><strong>${nombre}</strong> (${listasPersonalizadas[nombre].length} temas)</span>
                                 <button class="btn-accion" onclick="cargarListaPersonalizada('${nombre}')">REPRODUCIR</button>`;
                contenedor.appendChild(div);
            }
        }

        // Carga inicial
        renderizarListasPropia();
    </script>
</body>
</html>
