<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Audio</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-color: #e0e0e0;
      --accent-color: #007acc;
      --accent-hover: #0099ff;
      --border-radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    /* Estructura Principal */
    .app-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* BLOQUE SUPERIOR: REPRODUCTOR Y OSCILADOR */
    .player-section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .track-info {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
    }

    .canvas-container {
      width: 100%;
      height: 120px;
      background-color: #000;
      border-radius: var(--border-radius);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Estilo de Botones */
    .btn {
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      background-color: #2a2a2a;
      color: var(--text-color);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      background-color: #383838;
      border-color: #555;
    }

    .btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-hover);
      color: #fff;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 10px;
    }

    input[type="range"] {
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    /* BLOQUE INFERIOR: PARALELO (CATÁLOGO Y PLAYLIST) */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .panel h2 {
      font-size: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    /* Catálogo de Álbumes */
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .album-card {
      background-color: #282828;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .album-card:hover {
      background-color: #333;
      transform: translateY(-2px);
    }

    .album-cover {
      width: 100%;
      aspect-ratio: 1;
      background-color: #444;
      border-radius: calc(var(--border-radius) - 2px);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #aaa;
    }

    /* Lista de Reproducción */
    .playlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
    }

    .playlist-item {
      padding: 10px 12px;
      background-color: #252525;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .playlist-item:hover {
      background-color: #303030;
    }

    .playlist-item.playing {
      border-color: var(--accent-color);
      background-color: #1a2a3a;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- BLOQUE SUPERIOR: REPRODUCTOR CON OSCILADOR -->
    <section class="player-section">
      <div class="track-info" id="currentTrackTitle">Selecciona una pista</div>
      
      <div class="canvas-container">
        <canvas id="oscillatorCanvas"></canvas>
      </div>
      
      <div class="player-controls">
        <button id="btnPrev" class="btn">Anterior</button>
        <button id="btnPlay" class="btn">Reproducir</button>
        <button id="btnNext" class="btn">Siguiente</button>
        <button id="btnShuffle" class="btn">Aleatorio</button>
        
        <div class="volume-control">
          <label for="volumeSlider">Vol.</label>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </section>

    <!-- BLOQUE INFERIOR: CATÁLOGO Y PLAYLIST EN PARALELO -->
    <div class="content-grid">
      
      <!-- Catálogo de Álbumes -->
      <section class="panel">
        <h2>Catálogo de Álbumes</h2>
        <div class="album-grid" id="albumGrid">
          <!-- Renderizado dinámico -->
        </div>
      </section>

      <!-- Lista de Reproducción -->
      <section class="panel">
        <h2>Lista de Reproducción</h2>
        <ul class="playlist" id="playlistTracks">
          <!-- Renderizado dinámico -->
        </ul>
      </section>

    </div>

  </div>

  <audio id="audioPlayer" crossOrigin="anonymous"></audio>

  <script>
    // Datos de ejemplo
    const albumsData = [
      { id: 1, title: 'Álbum Sintetizador', artist: 'Artista A' },
      { id: 2, title: 'Frecuencia Cero', artist: 'Artista B' },
      { id: 3, title: 'Ondas Analógicas', artist: 'Artista C' },
      { id: 4, title: 'Modular Session', artist: 'Artista D' }
    ];

    const initialPlaylist = [
      { title: 'Tono Senoidal 440Hz', src: 'https://actions.google.com/sounds/v1/alarms/beep_short.ogg', duration: '0:03' },
      { title: 'Secuencia Digital', src: 'https://actions.google.com/sounds/v1/ambiences/rain_heavy.ogg', duration: '0:30' },
      { title: 'Pulso Eléctrico', src: 'https://actions.google.com/sounds/v1/science_fiction/scifi_laser.ogg', duration: '0:02' },
      { title: 'Ambiente Estático', src: 'https://actions.google.com/sounds/v1/weather/wind_synthetic.ogg', duration: '0:15' }
    ];

    // Variables de Estado
    let playlist = [...initialPlaylist];
    let currentTrackIndex = 0;
    let isPlaying = false;
    let isShuffle = false;

    // Referencias DOM
    const audio = document.getElementById('audioPlayer');
    const btnPlay = document.getElementById('btnPlay');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnShuffle = document.getElementById('btnShuffle');
    const volumeSlider = document.getElementById('volumeSlider');
    const currentTrackTitle = document.getElementById('currentTrackTitle');
    const playlistContainer = document.getElementById('playlistTracks');
    const albumGrid = document.getElementById('albumGrid');
    const canvas = document.getElementById('oscillatorCanvas');
    const canvasCtx = canvas.getContext('2d');

    // Contexto de Audio Web para el Oscilador
    let audioCtx;
    let analyser;
    let sourceNode;
    let isAudioCtxSetup = false;

    function setupAudioContext() {
      if (isAudioCtxSetup) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;

      sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      isAudioCtxSetup = true;
      drawOscilloscope();
    }

    // Dibujado en Canvas (Osciloscopio)
    function drawOscilloscope() {
      requestAnimationFrame(drawOscilloscope);

      const bufferLength = analyser ? analyser.frequencyBinCount : 0;
      const dataArray = new Uint8Array(bufferLength);

      if (analyser && isPlaying) {
        analyser.getByteTimeDomainData(dataArray);
      }

      canvasCtx.fillStyle = '#000000';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      canvasCtx.lineWidth = 2;
      canvasCtx.strokeStyle = '#0099ff';
      canvasCtx.beginPath();

      if (!analyser || !isPlaying) {
        canvasCtx.moveTo(0, canvas.height / 2);
        canvasCtx.lineTo(canvas.width, canvas.height / 2);
      } else {
        const sliceWidth = canvas.width / bufferLength;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * canvas.height) / 2;

          if (i === 0) {
            canvasCtx.moveTo(x, y);
          } else {
            canvasCtx.lineTo(x, y);
          }

          x += sliceWidth;
        }
      }

      canvasCtx.stroke();
    }

    // Renderizar Catálogo
    function renderCatalog() {
      albumGrid.innerHTML = '';
      albumsData.forEach(album => {
        const card = document.createElement('div');
        card.className = 'album-card';
        card.innerHTML = `
          <div class="album-cover">PORTADA</div>
          <div style="font-size:0.85rem; font-weight:600;">${album.title}</div>
          <div style="font-size:0.75rem; color:#888;">${album.artist}</div>
        `;
        albumGrid.appendChild(card);
      });
    }

    // Renderizar Playlist
    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlist.forEach((track, index) => {
        const li = document.createElement('li');
        li.className = `playlist-item ${index === currentTrackIndex ? 'playing' : ''}`;
        li.innerHTML = `
          <span>${index + 1}. ${track.title}</span>
          <span style="font-size:0.8rem; color:#aaa;">${track.duration}</span>
        `;
        li.addEventListener('click', () => {
          currentTrackIndex = index;
          loadTrack(currentTrackIndex);
          playAudio();
        });
        playlistContainer.appendChild(li);
      });
    }

    // Cargar y Reproducir Pistas
    function loadTrack(index) {
      if (playlist[index]) {
        audio.src = playlist[index].src;
        currentTrackTitle.textContent = playlist[index].title;
        renderPlaylist();
      }
    }

    function playAudio() {
      setupAudioContext();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audio.play();
      isPlaying = true;
      btnPlay.textContent = 'Pausa';
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      btnPlay.textContent = 'Reproducir';
    }

    // Lógica Aleatoria y Secuencial
    function playNextTrack() {
      if (playlist.length === 0) return;

      if (isShuffle) {
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * playlist.length);
        } while (randomIndex === currentTrackIndex && playlist.length > 1);
        
        currentTrackIndex = randomIndex;
      } else {
        currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      }

      loadTrack(currentTrackIndex);
      playAudio();
    }

    function playPrevTrack() {
      if (playlist.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex);
      playAudio();
    }

    // Eventos Controles
    btnPlay.addEventListener('click', () => {
      if (isPlaying) {
        pauseAudio();
      } else {
        if (!audio.src) loadTrack(currentTrackIndex);
        playAudio();
      }
    });

    btnNext.addEventListener('click', playNextTrack);
    btnPrev.addEventListener('click', playPrevTrack);

    btnShuffle.addEventListener('click', () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('active', isShuffle);
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    audio.addEventListener('ended', playNextTrack);

    // Ajuste de tamaño Canvas
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }

    window.addEventListener('resize', resizeCanvas);

    // Inicialización
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      renderCatalog();
      renderPlaylist();
      loadTrack(currentTrackIndex);
      drawOscilloscope();
    });
  </script>
</body>
</html>
