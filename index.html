<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Audio</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary-color: #1db954;
      --text-color: #ffffff;
      --text-secondary: #b3b3b3;
      --border-radius: 8px; /* Bordes más redondeados para contenedores */
      --btn-border-radius: 20px; /* Bordes redondeados para botones */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      min-height: 100vh;
    }

    /* 1. Reproductor superior con oscilador */
    .player-top {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    canvas#oscillator {
      width: 100%;
      height: 120px;
      background-color: #000000;
      border-radius: 6px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      background-color: #282828;
      color: var(--text-color);
      border: 1px solid #333;
      padding: 10px 18px;
      border-radius: var(--btn-border-radius); /* Redondeado aplicado */
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    button:hover {
      background-color: #3e3e3e;
      border-color: #555;
    }

    button.active {
      background-color: var(--primary-color);
      color: #000;
      font-weight: bold;
    }

    /* 2. Contenido principal: Catálogo y Lista de reproducción contiguos */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      flex-grow: 1;
    }

    .panel {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .panel h2 {
      font-size: 18px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      color: var(--text-secondary);
    }

    /* Estilos del Catálogo de Álbumes */
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
    }

    .album-card {
      background-color: #282828;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }

    .album-card:hover {
      background-color: #333;
    }

    /* Estilos de la Lista de Reproducción */
    .playlist-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-item {
      background-color: #282828;
      padding: 10px 15px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .playlist-item.active {
      border-left: 4px solid var(--primary-color);
      background-color: #333;
    }

    @media (max-width: 768px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Reproductor con Oscilador (Arriba) -->
  <section class="player-top">
    <canvas id="oscillator"></canvas>
    <div class="track-info">
      <span id="current-track-title">Seleccionar pista</span>
    </div>
    <div class="controls">
      <button id="btn-prev">Anterior</button>
      <button id="btn-play">Play</button>
      <button id="btn-next">Siguiente</button>
      <!-- Botón Aleatorio -->
      <button id="btn-shuffle" title="Reproducción Aleatoria">Aleatorio</button>
    </div>
  </section>

  <!-- Sección Inferior: Catálogo de Álbumes | Lista de Reproducción -->
  <div class="main-content">
    
    <!-- Catálogo de Álbumes -->
    <section class="panel catalog-panel">
      <h2>Catálogo de Álbumes</h2>
      <div class="album-grid">
        <div class="album-card">Álbum 1</div>
        <div class="album-card">Álbum 2</div>
        <div class="album-card">Álbum 3</div>
        <div class="album-card">Álbum 4</div>
      </div>
    </section>

    <!-- Lista de Reproducción -->
    <section class="panel playlist-panel">
      <h2>Lista de Reproducción</h2>
      <ul class="playlist-items" id="playlist">
        <li class="playlist-item active">1. Pista de Ejemplo A</li>
        <li class="playlist-item">2. Pista de Ejemplo B</li>
        <li class="playlist-item">3. Pista de Ejemplo C</li>
        <li class="playlist-item">4. Pista de Ejemplo D</li>
      </ul>
    </section>

  </div>

  <script>
    // Lógica del botón Aleatorio (Shuffle)
    const btnShuffle = document.getElementById('btn-shuffle');
    let isShuffle = false;

    btnShuffle.addEventListener('click', () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('active', isShuffle);
    });

    // Inicialización del oscilador en Canvas
    const canvas = document.getElementById('oscillator');
    const ctx = canvas.getContext('2d');

    function drawOscillator() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.strokeStyle = '#1db954';
      ctx.lineWidth = 2;

      const height = canvas.height;
      const width = canvas.width;
      ctx.moveTo(0, height / 2);

      for (let x = 0; x < width; x++) {
        const y = Math.sin(x * 0.05) * 20 + (height / 2);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    drawOscillator();
  </script>
</body>
</html>
